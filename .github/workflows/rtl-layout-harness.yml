# Rendered RTL layout harness: runs the Robolectric+Compose geometry tests for the composer and ordinary
# Markdown paragraphs on an exact revision, and publishes the measured geometry, screenshots and JUnit
# results. Test-only: no secrets, no APK, no lint, no writes outside this job's artifacts.
#
# The tests fail on purpose before the production fix (RED) and pass after it (GREEN). A manual run with
# `expected_result: RED` and `production_revision: <40-char commit id>` restores that revision's three
# production files before running the same tests, proving the fix is load-bearing.
#
# Fail-closed: the run only ends green when the declared expectation is actually demonstrated. Both Gradle
# exit statuses and the JUnit case identities are checked by .github/scripts/rtl_harness/check_reports.py,
# after the evidence has been uploaded with always(). A missing report, a compilation/setup failure, an
# unexpected failure or an unexpected pass all end the run non-zero.
#
# Untrusted dispatch input never reaches shell source: it is passed through the environment, validated as a
# full 40-character commit id, resolved with git to an immutable commit that is an ancestor of the
# triggering revision, and only then quoted into `git checkout`.
name: RTL layout harness

on:
  workflow_dispatch:
    inputs:
      expected_result:
        description: "What this run must demonstrate: GREEN (fix present) or RED (pre-fix files restored)"
        required: false
        default: GREEN
        type: choice
        options:
          - GREEN
          - RED
      production_revision:
        description: "RED only: full 40-character commit id whose production files replace HEAD's"
        required: false
        default: ""
        type: string
  push:
    branches: [test/rtl-layout-harness]

permissions:
  contents: read

concurrency:
  group: rtl-layout-harness-${{ github.ref }}
  cancel-in-progress: true

# Dispatch inputs are never interpolated into shell source. Only the input-validation step receives the raw
# values, through its own environment; every later step reads the validated outputs instead.

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatch inputs
        id: inputs
        env:
          # The only place the raw dispatch input is visible, and only as process environment.
          RTL_EXPECTED_RESULT: ${{ inputs.expected_result }}
          RTL_PRODUCTION_REVISION: ${{ inputs.production_revision }}
        run: |
          set -euo pipefail
          python3 .github/scripts/rtl_harness/validate_inputs.py \
            --expected-result "${RTL_EXPECTED_RESULT}" \
            --production-revision "${RTL_PRODUCTION_REVISION}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Verify exact source checkout
        id: source
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          echo "github.sha = $GITHUB_SHA"
          echo "HEAD       = $head_sha"
          test "$head_sha" = "$GITHUB_SHA" || { echo "::error::HEAD is not github.sha"; exit 1; }
          test ! -e .git/MERGE_HEAD || { echo "::error::merge checkout, not an exact revision"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "::error::dirty worktree"; git status --porcelain; exit 1; }
          echo "source_sha=$head_sha" >> "$GITHUB_ENV"
          echo "source_sha=$head_sha" >> "$GITHUB_OUTPUT"

      # RED re-proof: restore the three pre-fix production files from an immutable, full-SHA commit that is
      # already part of this checkout's own history. The resolved revision and the exact file delta are
      # recorded so a RED artifact can never be read as clean-HEAD evidence.
      - name: Resolve and apply the RED production revision
        id: production
        if: steps.inputs.outputs.mode == 'RED'
        env:
          PRODUCTION_REVISION: ${{ steps.inputs.outputs.production_revision }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          test "$checkout_sha" = "$GITHUB_SHA" || { echo "::error::HEAD moved before substitution"; exit 1; }

          resolved="$(git rev-parse --verify --quiet "${PRODUCTION_REVISION}^{commit}")" || {
            echo "::error::production_revision does not name a commit available in this checkout"
            exit 1
          }
          test "$resolved" = "$PRODUCTION_REVISION" || {
            echo "::error::production_revision did not resolve to itself; not an immutable commit id"
            exit 1
          }
          # Allowlist: only history reachable from the triggering revision may be substituted in.
          git merge-base --is-ancestor "$resolved" "$GITHUB_SHA" || {
            echo "::error::production_revision is not an ancestor of the triggering revision"
            exit 1
          }
          tree="$(git rev-parse --verify "${resolved}^{tree}")"

          echo "::notice::restoring pre-fix production files from $resolved (tree $tree) to re-run the same tests"
          git checkout "$resolved" -- \
            shared/ui/src/commonMain/kotlin/dev/hermeskotlin/ui/chat/ChatScreen.kt \
            shared/designsystem/src/commonMain/kotlin/dev/hermeskotlin/designsystem/components/MarkdownText.kt \
            shared/designsystem/src/commonMain/kotlin/dev/hermeskotlin/designsystem/components/BidiText.kt

          mkdir -p evidence
          git status --short > evidence/production-delta.txt
          git diff --stat >> evidence/production-delta.txt
          {
            echo "checkout_sha=$checkout_sha"
            echo "checkout_tree=$(git rev-parse "${checkout_sha}^{tree}")"
            echo "production_sha=$resolved"
            echo "production_tree=$tree"
          } | tee -a evidence/production-delta.txt >> "$GITHUB_ENV"

          changed="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' \
            shared/designsystem/src/commonMain/kotlin/dev/hermeskotlin/designsystem/components/BidiText.kt \
            shared/designsystem/src/commonMain/kotlin/dev/hermeskotlin/designsystem/components/MarkdownText.kt \
            shared/ui/src/commonMain/kotlin/dev/hermeskotlin/ui/chat/ChatScreen.kt | sort)"
          test "$changed" = "$expected" || {
            echo "::error::RED substitution changed files outside the three allowlisted production files"
            printf '%s\n' "$changed"
            exit 1
          }
          test -n "$(git diff HEAD --numstat)" || { echo "::error::RED substitution produced no delta"; exit 1; }

      - name: Self-test the input validator and the fail-closed gate
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts/rtl_harness/tests -p 'test_*.py' -v

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The exit status is recorded, not converted into success: the fail-closed verdict step at the end of
      # the job decides the run, after the evidence has been uploaded. Keeping this step from aborting early
      # is what lets a RED run publish its failure evidence.
      - name: Run the rendered layout tests
        id: tests
        run: |
          set +e
          ./gradlew --no-daemon --continue --console=plain \
            :shared:designsystem:testAndroidHostTest --tests 'dev.hermeskotlin.designsystem.components.MarkdownRtlLayoutTest' \
            :shared:ui:testAndroidHostTest --tests 'dev.hermeskotlin.ui.chat.ComposerRtlLayoutTest' \
            2>&1 | tee layout-tests.log
          status="${PIPESTATUS[0]}"
          echo "gradle_exit=$status" >> "$GITHUB_OUTPUT"
          echo "::notice::focused geometry tests exited $status (recorded; enforced by the fail-closed verdict)"
          # Keep the focused geometry evidence before the full suites overwrite the same report directory.
          mkdir -p evidence/layout
          for module in designsystem ui; do
            cp -r "shared/$module/build/test-results/testAndroidHostTest" "evidence/layout/junit-$module" 2>/dev/null || true
            cp -r "shared/$module/build/rtl-geometry" "evidence/layout/geometry-$module" 2>/dev/null || true
          done

      # The fix touches the shared Markdown renderer and the composer field, so the existing host suites run
      # too: the new geometry tests may not trade a layout defect for a behaviour regression.
      - name: Run the existing host suites
        id: regression
        run: |
          set +e
          ./gradlew --no-daemon --continue --console=plain \
            :shared:designsystem:testAndroidHostTest :shared:ui:testAndroidHostTest \
            2>&1 | tee regression-tests.log
          status="${PIPESTATUS[0]}"
          echo "gradle_exit=$status" >> "$GITHUB_OUTPUT"
          echo "::notice::existing host suites exited $status (recorded; enforced by the fail-closed verdict)"
          mkdir -p evidence/regression
          for module in designsystem ui; do
            cp -r "shared/$module/build/test-results/testAndroidHostTest" "evidence/regression/junit-$module" 2>/dev/null || true
          done

      - name: Publish geometry and JUnit results
        if: always()
        env:
          EXPECTED_RESULT: ${{ steps.inputs.outputs.mode }}
          FOCUSED_EXIT: ${{ steps.tests.outputs.gradle_exit }}
          REGRESSION_EXIT: ${{ steps.regression.outputs.gradle_exit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "### Rendered RTL layout harness"
            echo
            echo "- expected result: \`${EXPECTED_RESULT:-unvalidated}\`"
            echo "- source \`${source_sha:-unknown}\`"
            if [ -n "${production_sha:-}" ]; then
              echo "- RED substitution: production \`${production_sha}\` tree \`${production_tree:-unknown}\` over checkout \`${source_sha:-unknown}\`"
            fi
            echo "- focused geometry tests: gradle exit \`${FOCUSED_EXIT:-not-recorded}\`"
            echo "- existing host suites: gradle exit \`${REGRESSION_EXIT:-not-recorded}\`"
            echo "- run: ${RUN_URL}"
            echo
            echo "#### Measured geometry"
            echo
            echo '```'
            find evidence/layout -name '*.txt' -type f 2>/dev/null | sort | while read -r f; do
              printf '%s: ' "$(basename "$f")"
              cat "$f"
            done
            echo '```'
            echo
            echo "#### JUnit"
            echo
            echo '```'
            python3 - <<'PY'
          import glob, re
          from pathlib import Path

          def report(label, pattern):
              total = failures = errors = skipped = 0
              for xml in sorted(glob.glob(pattern)):
                  text = Path(xml).read_text(errors="replace")
                  m = re.search(r"<testsuite[^>]*>", text)
                  if not m:
                      continue
                  head = m.group(0)
                  def attr(name):
                      a = re.search(rf'{name}="(\d+)"', head)
                      return int(a.group(1)) if a else 0
                  total += attr("tests"); failures += attr("failures")
                  errors += attr("errors"); skipped += attr("skipped")
                  print(f"[{label}] {Path(xml).name}: tests={attr('tests')} failures={attr('failures')} "
                        f"errors={attr('errors')} skipped={attr('skipped')}")
                  if label == "focused":
                      for case in re.finditer(r'<testcase name="([^"]+)"[^>]*?(/>|>(.*?)</testcase>)', text, re.S):
                          body = case.group(3) or ""
                          if "<failure" in body or "<error" in body:
                              msg = re.search(r'message="([^"]{0,400})', body)
                              print(f"  FAILED {case.group(1)}: {msg.group(1) if msg else ''}")
              print(f"[{label}] TOTAL tests={total} failures={failures} errors={errors} skipped={skipped}")

          report("focused", "evidence/layout/junit-*/*.xml")
          report("regression", "evidence/regression/junit-*/*.xml")
          PY
            echo '```'
            echo
            echo "#### Test log (tail)"
            echo
            echo '```'
            tail -40 layout-tests.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "summary written"

      - name: Upload geometry, screenshots, JUnit and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rtl-layout-harness-${{ github.sha }}
          path: |
            evidence/
            shared/*/build/rtl-geometry/
            layout-tests.log
            regression-tests.log
          if-no-files-found: warn
          retention-days: 30

      # Last step, always run, and the only thing that decides the run: evidence exists before this gate
      # can redden the job. Mode empty means input validation already failed and the run is already red.
      - name: Enforce expected outcome (fail-closed)
        if: always() && steps.inputs.outputs.mode != ''
        env:
          EXPECTED_RESULT: ${{ steps.inputs.outputs.mode }}
          FOCUSED_EXIT: ${{ steps.tests.outputs.gradle_exit }}
          REGRESSION_EXIT: ${{ steps.regression.outputs.gradle_exit }}
        run: |
          set -euo pipefail
          python3 .github/scripts/rtl_harness/check_reports.py \
            --expected-result "${EXPECTED_RESULT}" \
            --focused-exit "${FOCUSED_EXIT}" \
            --regression-exit "${REGRESSION_EXIT}" \
            --focused-root evidence/layout \
            --regression-root evidence/regression \
            --github-summary "${GITHUB_STEP_SUMMARY}"
