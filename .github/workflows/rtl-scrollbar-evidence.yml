# Evidence only, not for upstream: renders the table scrollbar on the real desktop target, where it draws.
name: RTL table scrollbar evidence

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: "25"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Render the table scrollbar on the desktop target
        run: >
          xvfb-run -a ./gradlew --no-daemon --continue
          :shared:designsystem:jvmTest --tests "dev.hermeskotlin.designsystem.components.TableScrollbarDirectionTest"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-table-scrollbar-report
          path: shared/designsystem/build/reports/tests/jvmTest
          if-no-files-found: ignore
